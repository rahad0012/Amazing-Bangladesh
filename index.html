<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO & Metadata -->
    <title>অপরূপ বাংলাদেশ | Beautiful Bangladesh - Official Tourism Portal</title>
    <meta name="description" content="Discover Bangladesh's 8 administrative divisions, 64 districts, natural wonders, UNESCO World Heritage sites, and curated travel itineraries in Bengali and English." />
    <link rel="canonical" href="https://bangladesh-tourism.netlify.app/" />
    <link rel="alternate" hreflang="bn" href="https://bangladesh-tourism.netlify.app/?lang=bn" />
    <link rel="alternate" hreflang="en" href="https://bangladesh-tourism.netlify.app/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://bangladesh-tourism.netlify.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="অপরূপ বাংলাদেশ - Official Tourism Portal of Bangladesh" />
    <meta property="og:description" content="Explore all 8 divisions, 64 districts, Sundarbans, Cox's Bazar, Sajek, and authentic travel guides in Bengali & English." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1596895111956-bf1cf0599ce5?auto=format&fit=crop&w=1200&q=80" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="অপরূপ বাংলাদেশ - Official Tourism Portal of Bangladesh" />
    <meta name="twitter:description" content="Explore all 8 divisions, 64 districts, Sundarbans, Cox's Bazar, Sajek, and authentic travel guides." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1596895111956-bf1cf0599ce5?auto=format&fit=crop&w=1200&q=80" />

    <!-- Performance Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>

    <!-- Google Fonts: Hind Siliguri (Bengali) & Inter (English) -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS & Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Travel Stylesheet -->
    <link rel="stylesheet" href="/src/styles/custom.css">

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://bangladesh-tourism.netlify.app/#website",
          "url": "https://bangladesh-tourism.netlify.app/",
          "name": "Beautiful Bangladesh - Official Tourism Portal",
          "alternateName": "অপরূপ বাংলাদেশ",
          "description": "Discover all 8 administrative divisions, 64 districts, and natural wonders of Bangladesh.",
          "inLanguage": ["bn", "en"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://bangladesh-tourism.netlify.app/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "TouristDestination",
          "@id": "https://bangladesh-tourism.netlify.app/#country",
          "name": "Bangladesh",
          "alternateName": "বাংলাদেশ",
          "description": "A South Asian riverine nation bordered by the Bay of Bengal, home to the Sundarbans mangrove forest, Cox's Bazar beach, and lush hill tracts.",
          "touristType": ["EcoTourism", "CulturalTourism", "HeritageTourism", "AdventureTourism"],
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": "23.6850",
            "longitude": "90.3563"
          },
          "containsPlace": [
            { "@type": "TouristAttraction", "name": "Sundarbans Mangrove Forest" },
            { "@type": "TouristAttraction", "name": "Cox's Bazar Sea Beach" },
            { "@type": "TouristAttraction", "name": "Sajek Valley" },
            { "@type": "TouristAttraction", "name": "Sixty Dome Mosque" },
            { "@type": "TouristAttraction", "name": "Somapura Mahavihara at Paharpur" },
            { "@type": "TouristAttraction", "name": "Sreemangal Tea Estates" },
            { "@type": "TouristAttraction", "name": "Kuakata Sea Beach" },
            { "@type": "TouristAttraction", "name": "Tanguar Haor" }
          ]
        },
        {
          "@type": "BreadcrumbList",
          "@id": "https://bangladesh-tourism.netlify.app/#breadcrumbs",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://bangladesh-tourism.netlify.app/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Divisions",
              "item": "https://bangladesh-tourism.netlify.app/#divisions"
            },
            {
              "@type": "ListItem",
              "position": 3,
              "name": "64 Districts",
              "item": "https://bangladesh-tourism.netlify.app/#districts"
            },
            {
              "@type": "ListItem",
              "position": 4,
              "name": "Attractions",
              "item": "https://bangladesh-tourism.netlify.app/#spots"
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body class="lang-bn">
    <!-- Accessibility Skip Link -->
    <a href="#app-root" class="skip-to-content-link">Skip to main content / মূল বিষয়বস্তুতে যান</a>

    <!-- Section 1: Navbar (Dynamic Reusable Component) -->
    <header id="navbar-root"></header>

    <!-- Main Dynamic Application Container -->
    <main id="app-root">
      <!-- Injected via /src/main.ts -->
      <div class="text-center py-5">
        <div class="spinner-border text-success" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </main>

    <!-- Section 9: Footer (Dynamic Reusable Component) -->
    <div id="footer-root"></div>

    <!-- Spot Details Modal -->
    <div class="modal fade" id="spotDetailsModal" tabindex="-1" aria-labelledby="spotDetailsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content modal-travel-content" id="spotModalContent">
          <!-- Injected via JavaScript -->
        </div>
      </div>
    </div>

    <!-- Admin & Firestore Control Modal -->
    <div class="modal fade" id="adminModal" tabindex="-1" aria-labelledby="adminModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-travel-content" id="adminModalContent">
          <!-- Injected via JavaScript -->
        </div>
      </div>
    </div>

    <!-- Reusable CMS CRUD Form Modal -->
    <div class="modal fade" id="cmsCrudModal" tabindex="-1" aria-labelledby="cmsCrudModalLabel" aria-hidden="true" data-bs-backdrop="static">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content modal-travel-content" id="cmsCrudModalContent">
          <!-- Injected dynamically via CMS controller -->
        </div>
      </div>
    </div>

    <!-- Reusable CMS Confirmation & Warning Modal -->
    <div class="modal fade" id="cmsConfirmModal" tabindex="-1" aria-labelledby="cmsConfirmModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-travel-content" id="cmsConfirmModalContent">
          <!-- Injected dynamically for delete/relationship checks -->
        </div>
      </div>
    </div>

    <!-- Image Full Preview Modal -->
    <div class="modal fade" id="cmsImagePreviewModal" tabindex="-1" aria-labelledby="cmsImagePreviewModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content modal-travel-content bg-dark text-white text-center p-3" id="cmsImagePreviewContent">
          <!-- Image preview -->
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;" id="cmsToastContainer"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Main Vanilla JavaScript/TypeScript Application -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
